 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance - B.Tech</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .modal {
            background: #fff;
            width: 100%;
            max-width: 1250px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        /* Header Section */
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #f8fafc;
            flex-wrap: wrap; 
            gap: 10px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Navigation Tabs Container */
        .tabs-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 5px;
        }

        .tab-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 6px 16px;
            border: 1px solid #cbd5e1;
            background: #fff;
            color: #475569;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #f1f5f9;
        }

        .tab-btn.active {
            background: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
            box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3);
        }

        .sub-tab-btn {
            padding: 5px 12px;
            font-size: 12px;
            background: #e2e8f0;
            border: none;
        }

        .sub-tab-btn.active {
            background: #0f172a;
            color: white;
        }

        .modal-title {
            font-size: 18px;
            color: #1e293b;
            font-weight: 700;
            margin-top: 5px;
        }

        .info-text {
            font-size: 13px;
            color: #334155;
            font-weight: 500;
            line-height: 1.4;
        }
        
        .info-text span {
            font-weight: 700;
            color: #0f172a;
        }

        .header-subtitle {
            font-size: 13px;
            color: #ef4444; 
            font-weight: 600;
            margin-top: 3px;
        }

        .live-clock {
            font-size: 13px;
            color: #0ea5e9;
            font-weight: bold;
            background: #e0f2fe;
            padding: 6px 10px;
            border-radius: 5px;
        }

        .stats {
            display: flex;
            gap: 8px;
            font-size: 12px;
        }

        .stat-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .stat-total { background: #e2e8f0; color: #475569; }
        .stat-present { background: #dcfce7; color: #166534; }
        .stat-absent { background: #fee2e2; color: #991b1b; }

        /* Filters Section */
        .filters {
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            flex-wrap: wrap;
        }
        
        .filters label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }

        /* Grid Section */
        .student-grid {
            padding: 15px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); 
            gap: 8px; 
            max-height: calc(100vh - 300px); 
            overflow-y: auto;
        }

        /* Student Card */
        .student-card {
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            background: #fff;
            height: 42px; 
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        /* Serial Number */
        .serial-no {
            font-size: 11px;
            color: #94a3b8;
            font-weight: bold;
            min-width: 18px;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .roll-no {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
        }

        .student-name {
            font-size: 12px;
            color: #1e293b;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Status Indicator */
        .status-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
            flex-shrink: 0;
        }

        /* Absent State (Default) - No cross mark */
        .student-card.absent {
            border-color: #fca5a5;
            background-color: #fef2f2;
        }
        .student-card.absent .status-icon {
            background-color: #ef4444;
        }

        /* Present State - Green tick */
        .student-card.present {
            border-color: #86efac;
            background-color: #f0fdf4;
        }
        .student-card.present .status-icon {
            background-color: #22c55e;
        }
        .student-card.present .status-icon::after { content: "✓"; }

        /* Footer Section */
        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
        .btn-outline:hover { background: #e2e8f0; }

        /* Responsive adjustments for mobile */
        @media (max-width: 600px) {
            .student-grid { grid-template-columns: 1fr; max-height: none; }
            .modal-header { flex-direction: column; align-items: flex-start; }
            .modal-footer { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>

        // State Management
        let currentSemester = '3rd';
        let currentSection = 'A';
        let attendanceState = {};

        // 1. Function to Update Live Clock and Header Text
        function updateClockAndHeader() {
            const current = new Date();
            const timeString = current.toLocaleTimeString('en-US', { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });
            const dateString = current.toLocaleDateString('en-GB');
            
            document.getElementById('liveClock').innerText = `📅 ${dateString} | ⏰ ${timeString}`;
            document.getElementById('absenteeHeaderText').innerText = `Absentees in red mark on ${dateString}`;
        }

        // 2. Function to Switch Semester (Level 1)
        function switchSemester(sem) {
            currentSemester = sem;
            
            // Update active button styling for Semester
            document.getElementById('sem-tab-3rd').classList.remove('active');
            document.getElementById('sem-tab-5th').classList.remove('active');
            document.getElementById(`sem-tab-${sem}`).classList.add('active');

            // Dynamically render section buttons for this semester
            renderSectionTabs();
            
            // Auto-select the first section
            const availableSections = Object.keys(academicData[currentSemester].sections);
            switchSection(availableSections[0]);
        }

        // 3. Function to Render Section Tabs
        function renderSectionTabs() {
            const container = document.getElementById('sectionTabsContainer');
            container.innerHTML = ''; // Clear previous tabs
            
            const sections = academicData[currentSemester].sections;
            
            for (const secKey in sections) {
                const btn = document.createElement('button');
                btn.className = `tab-btn sub-tab-btn ${currentSection === secKey ? 'active' : ''}`;
                btn.innerText = `Section ${secKey}`;
                btn.onclick = () => switchSection(secKey);
                container.appendChild(btn);
            }
        }

        // 4. Function to Switch Section (Level 2)
        function switchSection(sec) {
            currentSection = sec;
            
            // Update section button styling
            const sectionBtns = document.querySelectorAll('.sub-tab-btn');
            sectionBtns.forEach(btn => {
                if(btn.innerText === `Section ${sec}`) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Update Header Info
            const secData = academicData[currentSemester].sections[sec];
            document.getElementById('headerSubject').innerText = secData.subject;
            document.getElementById('headerClass').innerText = secData.className;

            // Load data for this section
            loadStateFromLocal();
            
            // Re-render UI
            renderGrid();
            updateStats();
            
            // Reset Select All checkbox
            document.getElementById('selectAll').checked = false;
        }

        // Storage Key generator (Unique for Semester, Section and Date)
        function getStorageKey() {
            return `attendance_${currentSemester}_${currentSection}_${todayDate}`;
        }

        // 5. Initialize App
        function init() {
            updateClockAndHeader();
            setInterval(updateClockAndHeader, 1000); 
            switchSemester('3rd'); // Start with 3rd Sem
        }

        // Load state from LocalStorage
        function loadStateFromLocal() {
            const storageKey = getStorageKey();
            const savedData = localStorage.getItem(storageKey);
            
            if (savedData) {
                attendanceState = JSON.parse(savedData);
            } else {
                // Fresh start for the day (All absent by default)
                attendanceState = {};
                academicData[currentSemester].sections[currentSection].students.forEach((s, index) => {
                    attendanceState[index] = 'absent'; 
                });
            }
        }

        // 6. Render Student Cards
        function renderGrid() {
            gridContainer.innerHTML = '';
            const students = academicData[currentSemester].sections[currentSection].students;
            
            students.forEach((student, index) => {
                const isPresent = attendanceState[index] === 'present';
                
                const card = document.createElement('div');
                card.className = `student-card ${isPresent ? 'present' : 'absent'}`;
                card.onclick = () => toggleAttendance(index);
                
                card.innerHTML = `
                    <div class="card-left">
                        <span class="serial-no">${index + 1}</span>
                        <div class="student-info">
                            <span class="roll-no">${student.roll}</span>
                            <span class="student-name">${student.name}</span>
                        </div>
                    </div>
                    <div class="status-icon"></div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // 7. Toggle Present/Absent
        function toggleAttendance(index) {
            if (attendanceState[index] === 'present') {
                attendanceState[index] = 'absent';
            } else {
                attendanceState[index] = 'present';
            }
            renderGrid();
            updateStats();
            saveToLocal(); 
        }

        // 8. Update Counters
        function updateStats() {
            let present = 0;
            let absent = 0;
            const totalStudents = academicData[currentSemester].sections[currentSection].students.length;
            
            Object.values(attendanceState).forEach(state => {
                if (state === 'present') present++;
                else absent++;
            });

            document.getElementById('totalCount').innerText = `Total: ${totalStudents}`;
            document.getElementById('presentCount').innerText = `Present: ${present}`;
            document.getElementById('absentCount').innerText = `Absent: ${absent}`;
        }

        // 9. Save to LocalStorage
        function saveToLocal() {
            localStorage.setItem(getStorageKey(), JSON.stringify(attendanceState));
        }

        function saveAttendance() {
            saveToLocal();
            const classInfo = academicData[currentSemester].sections[currentSection].className;
            alert(`Attendance for ${classInfo} (${todayDate}) saved successfully!`);
        }

        // 10. Reset Today's Data
        function resetData() {
            const classInfo = academicData[currentSemester].sections[currentSection].className;
            if(confirm(`Are you sure you want to reset attendance for ${classInfo}?`)) {
                academicData[currentSemester].sections[currentSection].students.forEach((s, index) => {
                    attendanceState[index] = 'absent';
                });
                saveToLocal();
                renderGrid();
                updateStats();
            }
        }

        // 11. Generate WhatsApp Message
        function generateWhatsAppMessage() {
            const students = academicData[currentSemester].sections[currentSection].students;
            let absentees = [];
            
            students.forEach((student, index) => {
                if (attendanceState[index] === 'absent') {
                    absentees.push(`${student.roll} - ${student.name}`);
                }
            });

            if (absentees.length === 0) {
                alert("All students are present! No absentees found.");
                return;
            }

            const secData = academicData[currentSemester].sections[currentSection];
            const message = `*Attendance Report*\n\n*Class:* ${secData.className}\n*Subject:* ${secData.subject}\n*Faculty:* NamanSharma\n*Date:* ${todayDate}\n\n*Absentees List:*\n${absentees.join('\n')}\n\n`;
            
            navigator.clipboard.writeText(message).then(() => {
                alert("Absentees list copied to clipboard! Please paste it in WhatsApp to send.");
            }).catch(err => {
                prompt("Could not copy automatically. Please manually copy the message below:", message);
            });
        }

        // 12. Select All Checkbox Logic
        document.getElementById('selectAll').addEventListener('change', function(e) {
            const isChecked = e.target.checked;
            const allState = isChecked ? 'present' : 'absent';
            
            academicData[currentSemester].sections[currentSection].students.forEach((s, index) => {
                attendanceState[index] = allState;
            });
            
            saveToLocal();
            renderGrid();
            updateStats();
        });

        // Start the app
        init();

    </script>
</body>
</html>

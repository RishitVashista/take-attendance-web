 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance - AI & ML</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .modal {
            background: #fff;
            width: 100%;
            max-width: 1100px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        /* Header Section */
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-title {
            font-size: 18px;
            color: #1e293b;
            font-weight: 600;
        }

        .header-subtitle {
            font-size: 13px;
            color: #ef4444; 
            font-weight: 600;
        }

        .live-clock {
            font-size: 14px;
            color: #0ea5e9;
            font-weight: bold;
            background: #e0f2fe;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .stats {
            display: flex;
            gap: 10px;
            font-size: 12px;
        }

        .stat-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .stat-total { background: #e2e8f0; color: #475569; }
        .stat-present { background: #dcfce7; color: #166534; }
        .stat-absent { background: #fee2e2; color: #991b1b; }

        /* Filters Section */
        .filters {
            padding: 10px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .filters label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }

        /* Grid Section */
        .student-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Student Card */
        .student-card {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            background: #fff;
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Serial Number */
        .serial-no {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
            min-width: 20px;
        }

        .student-info {
            display: flex;
            flex-direction: column;
        }

        .roll-no {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .student-name {
            font-size: 13px;
            color: #1e293b;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* Status Indicator */
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        /* Absent State (Default) - No cross mark */
        .student-card.absent {
            border-color: #fca5a5;
            background-color: #fef2f2;
        }
        .student-card.absent .status-icon {
            background-color: #ef4444;
        }

        /* Present State - Green tick */
        .student-card.present {
            border-color: #86efac;
            background-color: #f0fdf4;
        }
        .student-card.present .status-icon {
            background-color: #22c55e;
        }
        .student-card.present .status-icon::after { content: "✓"; }

        /* Footer Section */
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-primary { background: #0ea5e9; color: white; }
        .btn-primary:hover { background: #0284c7; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
        .btn-outline:hover { background: #e2e8f0; }

        /* Responsive */
        @media (max-width: 900px) { .student-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            .student-grid { grid-template-columns: 1fr; }
            .modal-header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="modal">
        <!-- Header with Live Date, Time and Absentees Mark -->
        <div class="modal-header">
            <div class="header-left">
                <div class="modal-title">Take Attendance - B.Tech CSE (AI & ML)</div>
                <!-- Dynamic Line for Absentees -->
                <div class="header-subtitle" id="absenteeHeaderText">Absentees in red mark on ...</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
                <!-- Live Clock -->
                <div class="live-clock" id="liveClock">Loading...</div>
                <div class="stats">
                    <span class="stat-badge stat-total" id="totalCount">Total: 45</span>
                    <span class="stat-badge stat-present" id="presentCount">Present: 0</span>
                    <span class="stat-badge stat-absent" id="absentCount">Absent: 45</span>
                </div>
            </div>
        </div>

        <div class="filters">
            <label><input type="checkbox" id="selectAll"> Check/Uncheck All</label>
            <span style="color: #64748b; font-size: 11px;">(Click on a student card to toggle Present/Absent)</span>
        </div>

        <div class="student-grid" id="studentGrid">
            <!-- Cards will be generated by JS -->
        </div>

        <div class="modal-footer">
            <div>
                <button class="btn btn-outline" onclick="resetData()">Reset Today's Data</button>
            </div>
            <div>
                <button class="btn btn-success" onclick="generateWhatsAppMessage()">Send to Absentees (WhatsApp)</button>
                <button class="btn btn-primary" onclick="saveAttendance()">Save Attendance</button>
            </div>
        </div>
    </div>

    <script>
        // --- Student Data ---
        // Roll numbers se 21/22/23 hata kar sirf H250... kar diya gaya hai.
        const studentsData = [
            { roll: "H250033", name: "DHRUV CHAUHAN" },
            { roll: "H250044", name: "DEVANSH SHARMA" },
            { roll: "H250049", name: "HARSHIT SHARMA" },
            { roll: "H250079", name: "HIMESH THAKUR" },
            { roll: "H250231", name: "SHUBHAM SHARMA" },
            { roll: "H250232", name: "YASHITA SHARMA" },
            { roll: "H250243", name: "YOGRAJ THAKUR" },
            { roll: "H250252", name: "ADITYA DHIMAN" },
            { roll: "H250261", name: "ARPRIT SHARMA" },
            { roll: "H250297", name: "PULKIT SHARMA" },
            { roll: "H2503083", name: "VIKASH CHAUHAN" },
            { roll: "H250337", name: "RAJAT CHANDEL" },
            { roll: "H250343", name: "ABHAY CHOUHAN" },
            { roll: "H250351", name: "ARYAN SAKLANI" },
            { roll: "H250353", name: "SHUBHAM" },
            { roll: "H250360", name: "ABHAY SINGH THAKUR" },
            { roll: "H250371", name: "SAURABH CHAUHAN" },
            { roll: "H250398", name: "KHUSI CHAUHAN" },
            { roll: "H250399", name: "AYUSH RANGRA" },
            { roll: "H250407", name: "SURYANSH THAKUR" },
            { roll: "H250409", name: "ANSHUL" },
            { roll: "H250461", name: "ANKITA KUMARI" },
            { roll: "H250465", name: "PIYUSH KUMAR" },
            { roll: "H250493", name: "AMIT NISHAD" },
            { roll: "H250510", name: "KARTIKEY SHARMA" },
            { roll: "H250585", name: "ANJALI" },
            { roll: "H250618", name: "NISHANT THAKUR" },
            { roll: "H250629", name: "SUMIT KUMAR" },
            { roll: "H250655", name: "NIKHIL THAKUR" },
            { roll: "H250661", name: "ADITYA DHIMAN" },
            { roll: "H250662", name: "ADITYA THAKUR" },
            { roll: "H250663", name: "SAHIL CHOUDHARY" },
            { roll: "H250683", name: "ANSHIKA" },
            { roll: "H250698", name: "SURBHI THAKUR" },
            { roll: "H250747", name: "RISHIT VASHISTA " },
            { roll: "H250796", name: "MANVI THAKUR" },
            { roll: "H250872", name: "ARMAN SUPAHIYA" },
            { roll: "H250875", name: "SHUBHAM KUMAR" },
            { roll: "H2500909", name: "ABHISHEK GULERIA" },
            { roll: "H250915", name: "AYUSH KOUNDAL" },
            { roll: "H250922", name: "MANISH KUMAR" },
            { roll: "H250951", name: "ABHISHEK" },
            { roll: "H250980", name: "RITIKA KUMARI" },
            { roll: "H250985", name: "MANDEEP SINGH" },
            { roll: "H251177", name: "PALAK" }
        ];

        const gridContainer = document.getElementById('studentGrid');
        
        // Get Today's Date for Reset Logic & Display
        const now = new Date();
        const todayDate = now.toLocaleDateString('en-GB'); // Format: DD/MM/YYYY
        
        // Daily Reset Logic: Key changes every day
        const storageKey = `attendance_${todayDate}`;
        
        let attendanceState = {};

        // 1. Function to Update Live Clock and Header Text
        function updateClockAndHeader() {
            const current = new Date();
            
            // Live Time string
            const timeString = current.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            });
            
            // Live Date string
            const dateString = current.toLocaleDateString('en-GB');
            
            document.getElementById('liveClock').innerText = `📅 ${dateString} | ⏰ ${timeString}`;
            
            // Update Header Text
            document.getElementById('absenteeHeaderText').innerText = `Absentees in red mark on ${dateString}`;
        }

        // Initialize App
        function init() {
            // Start Clock
            updateClockAndHeader();
            setInterval(updateClockAndHeader, 1000); // Update every second

            // Check if data exists for today
            const savedData = localStorage.getItem(storageKey);
            
            if (savedData) {
                attendanceState = JSON.parse(savedData);
            } else {
                // Fresh start for the day (Sabhi absent by default)
                studentsData.forEach((s, index) => {
                    attendanceState[index] = 'absent'; 
                });
            }

            renderGrid();
            updateStats();
        }

        // Render Student Cards
        function renderGrid() {
            gridContainer.innerHTML = '';
            studentsData.forEach((student, index) => {
                const isPresent = attendanceState[index] === 'present';
                
                const card = document.createElement('div');
                card.className = `student-card ${isPresent ? 'present' : 'absent'}`;
                card.onclick = () => toggleAttendance(index);
                
                // Yahan par (index + 1) ka use karke numbering (1, 2, 3...) di gayi hai
                card.innerHTML = `
                    <div class="card-left">
                        <span class="serial-no">${index + 1}</span>
                        <div class="student-info">
                            <span class="roll-no">${student.roll}</span>
                            <span class="student-name">${student.name}</span>
                        </div>
                    </div>
                    <div class="status-icon"></div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // Toggle Present/Absent
        function toggleAttendance(index) {
            if (attendanceState[index] === 'present') {
                attendanceState[index] = 'absent';
            } else {
                attendanceState[index] = 'present';
            }
            renderGrid();
            updateStats();
            saveToLocal(); 
        }

        // Update Counters
        function updateStats() {
            let present = 0;
            let absent = 0;
            
            Object.values(attendanceState).forEach(state => {
                if (state === 'present') present++;
                else absent++;
            });

            document.getElementById('totalCount').innerText = `Total: ${studentsData.length}`;
            document.getElementById('presentCount').innerText = `Present: ${present}`;
            document.getElementById('absentCount').innerText = `Absent: ${absent}`;
        }

        // Save to LocalStorage (Browser memory)
        function saveToLocal() {
            localStorage.setItem(storageKey, JSON.stringify(attendanceState));
        }

        // Manual Save Button
        function saveAttendance() {
            saveToLocal();
            alert(`Attendance for ${todayDate} saved successfully!`);
        }

        // Reset Today's Data
        function resetData() {
            if(confirm("Are you sure you want to reset today's attendance? All students will be marked absent.")) {
                studentsData.forEach((s, index) => {
                    attendanceState[index] = 'absent';
                });
                saveToLocal();
                renderGrid();
                updateStats();
            }
        }

        // Generate WhatsApp Message for Absentees
        function generateWhatsAppMessage() {
            let absentees = [];
            studentsData.forEach((student, index) => {
                if (attendanceState[index] === 'absent') {
                    absentees.push(`${student.roll} - ${student.name}`);
                }
            });

            if (absentees.length === 0) {
                alert("Sabhi students present hain! Koi absent nahi hai.");
                return;
            }

            const message = `Dear Parents,\n\nAaj ki date (${todayDate}) par aapka bacha class mein absent hai:\n\n${absentees.join('\n')}\n\nPlease ensure regular attendance.\n\n- Class Teacher (AI & ML)`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(message).then(() => {
                alert("Absentees  list IS copied to clipboard! Please paste it in WhatsApp to send.");
            }).catch(err => {
                prompt(" if doesnt Copy so Please manually copy it:", message);
            });
        }

        // Start the app
        init();

    </script>
</body>
</html>
